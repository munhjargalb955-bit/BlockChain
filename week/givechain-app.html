<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GiveChain V2</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f7f7f7;
    }

    section,
    .campaign {
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
      margin: 16px 0;
    }

    input,
    select,
    button {
      padding: 10px 12px;
      margin: 4px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button { cursor: pointer; }
    button:hover { opacity: 0.85; }

    .campaign-info,
    #accountInfo,
    #eventList {
      line-height: 1.8;
    }

    #status {
      background: #eee;
      border-radius: 10px;
      padding: 14px;
      margin-top: 20px;
      min-height: 48px;
      word-break: break-all;
    }

    a { color: #3366cc; }
  </style>
</head>

<body>
<main>

  <h1>GiveChain</h1>

  <section>
    <h2>Wallet</h2>

    <button id="connectBtn">
      MetaMask 연결
    </button>

    <button id="refreshBtn">
      새로고침
    </button>

    <div id="accountInfo">
      Wallet 연결 필요
    </div>
  </section>

  <section id="ownerPanel" hidden>
    <h2>Campaign 생성</h2>

    <input id="titleInput" placeholder="Campaign 제목">
    <input id="goalInput" placeholder="목표 금액">
    <input id="beneficiaryInput" placeholder="Beneficiary Address" size="44">

    <select id="assetSelect">
      <option value="ETH">ETH</option>
      <option value="GVT">GVT</option>
    </select>

    <button id="createBtn">
      Campaign 생성
    </button>
  </section>

  <section>
    <h2>Campaign</h2>

    <div id="campaignList">
      Wallet 연결 후 Campaign이 표시됩니다.
    </div>
  </section>

  <section>
    <h2>On-chain Activity</h2>

    <button id="eventsBtn">
      기부 Event 조회
    </button>

    <ul id="eventList"></ul>
  </section>

  <div id="status">Ready</div>

</main>

<script type="module">

import { ethers } from
"https://cdn.jsdelivr.net/npm/ethers@6.17.0/+esm";

// Hardhat Local (chain 31338). Sepolia 로 바꿀 때는 아래 값만 교체한다.
//   chainId: "0xaa36a7", explorer: "https://sepolia.etherscan.io"
const CONFIG = {
  chainId: "0x7a6a",
  explorer: "",
  giveChain: "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707",
  token: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9",
  deploymentBlock: 0
};

const GIVECHAIN_ABI = [
  "function owner() view returns (address)",
  "function campaignCount() view returns (uint256)",
  "function campaigns(uint256) view returns (address owner,string title,uint256 goal,uint256 raised,address beneficiary,address asset,uint8 stage,bool withdrawn,uint256 refunded)",
  "function donations(uint256,address) view returns (uint256)",
  "function lifetimeDonatedByAsset(address) view returns (uint256)",
  "function createCampaign(string,uint256,address,address) returns (uint256)",
  "function donateETH(uint256) payable",
  "function donateToken(uint256,uint256)",
  "function finalizeCampaign(uint256)",
  "function withdraw(uint256)",
  "function refund(uint256)",
  "event CampaignCreated(uint256 indexed campaignId,address indexed owner,string title,uint256 goal,address indexed beneficiary,address asset)",
  "event Donated(uint256 indexed campaignId,address indexed donor,address indexed asset,uint256 amount)",
  "event CampaignFinalized(uint256 indexed campaignId,uint8 stage)",
  "event Withdrawn(uint256 indexed campaignId,address indexed beneficiary,address indexed asset,uint256 amount)",
  "event Refunded(uint256 indexed campaignId,address indexed donor,address indexed asset,uint256 amount)"
];

const ERC20_ABI = [
  "function symbol() view returns (string)",
  "function decimals() view returns (uint8)",
  "function balanceOf(address) view returns (uint256)",
  "function allowance(address,address) view returns (uint256)",
  "function approve(address,uint256) returns (bool)"
];

const STAGES = ["NONE", "OPEN", "SUCCESS", "FAILED"];

let provider;
let signer;
let account;
let appOwner;
let giveChainRead;
let giveChainWrite;
let tokenRead;
let tokenWrite;
let tokenDecimals = 18;
let tokenSymbol = "GVT";

const $ = (id) => document.getElementById(id);

const same = (a, b) =>
  a?.toLowerCase() === b?.toLowerCase();

const short = (value) => {
  if (!value) return "-";
  return value.slice(0, 6) + "..." + value.slice(-4);
};

const stageName = (value) =>
  STAGES[Number(value)] ?? "UNKNOWN";

const txUrl = (hash) =>
  `${CONFIG.explorer}/tx/${hash}`;

function setStatus(message) {
  $("status").innerHTML = message;
}

function friendlyError(error) {
  if (
    error?.code === 4001 ||
    error?.code === "ACTION_REJECTED"
  ) {
    return "사용자가 Transaction을 취소했습니다.";
  }

  return (
    error?.shortMessage ||
    error?.reason ||
    error?.message ||
    "알 수 없는 오류가 발생했습니다."
  );
}

function formatAmount(asset, amount) {
  if (same(asset, ethers.ZeroAddress)) {
    return ethers.formatEther(amount) + " ETH";
  }

  return (
    ethers.formatUnits(amount, tokenDecimals) +
    ` ${tokenSymbol}`
  );
}

async function connectWallet() {
  try {
    if (!window.ethereum) {
      throw new Error("MetaMask가 설치되어 있지 않습니다.");
    }

    await window.ethereum.request({
      method: "eth_requestAccounts"
    });

    const chainId = await window.ethereum.request({
      method: "eth_chainId"
    });

    if (
      chainId.toLowerCase() !==
      CONFIG.chainId.toLowerCase()
    ) {
      throw new Error(
        "MetaMask Network를 Hardhat Local로 변경하세요."
      );
    }

    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    account = await signer.getAddress();

    await initContracts();
    await refreshAll();
    listenEvents();

    setStatus(
      `Wallet 연결 완료: ${short(account)}`
    );
  }
  catch (error) {
    setStatus(friendlyError(error));
  }
}

async function initContracts() {
  if (!ethers.isAddress(CONFIG.giveChain)) {
    throw new Error(
      "GiveChainV2 Contract Address를 설정하세요."
    );
  }

  if (!ethers.isAddress(CONFIG.token)) {
    throw new Error(
      "GiveTokenV2 Contract Address를 설정하세요."
    );
  }

  giveChainRead = new ethers.Contract(
    CONFIG.giveChain,
    GIVECHAIN_ABI,
    provider
  );

  giveChainWrite = new ethers.Contract(
    CONFIG.giveChain,
    GIVECHAIN_ABI,
    signer
  );

  tokenRead = new ethers.Contract(
    CONFIG.token,
    ERC20_ABI,
    provider
  );

  tokenWrite = new ethers.Contract(
    CONFIG.token,
    ERC20_ABI,
    signer
  );

  tokenDecimals = Number(await tokenRead.decimals());
  tokenSymbol = await tokenRead.symbol();
}

async function loadAccountSummary() {
  appOwner = await giveChainRead.owner();

  const [ethBalance, tokenBalance, allowance] =
    await Promise.all([
      provider.getBalance(account),
      tokenRead.balanceOf(account),
      tokenRead.allowance(account, CONFIG.giveChain)
    ]);

  $("accountInfo").innerHTML = `
    <strong>Account</strong>: ${short(account)}<br>
    <strong>ETH</strong>: ${ethers.formatEther(ethBalance)}<br>
    <strong>${tokenSymbol}</strong>:
    ${ethers.formatUnits(tokenBalance, tokenDecimals)}<br>
    <strong>Allowance</strong>:
    ${ethers.formatUnits(allowance, tokenDecimals)}
    ${tokenSymbol}
  `;

  $("ownerPanel").hidden =
    !same(account, appOwner);
}

async function loadCampaigns() {
  const count = Number(
    await giveChainRead.campaignCount()
  );

  $("campaignList").innerHTML = "";

  if (count === 0) {
    $("campaignList").innerHTML =
      "아직 Campaign이 없습니다.";
    return;
  }

  for (let id = 0; id < count; id++) {
    const campaign = await giveChainRead.campaigns(id);
    const myDonation = await giveChainRead.donations(
      id,
      account
    );

    renderCampaign(id, campaign, myDonation);
  }
}

function renderCampaign(id, c, myDonation) {
  const isETH = same(c.asset, ethers.ZeroAddress);
  const stage = Number(c.stage);
  const symbol = isETH ? "ETH" : tokenSymbol;

  const format = (value) =>
    isETH
      ? ethers.formatEther(value)
      : ethers.formatUnits(value, tokenDecimals);

  const canFinalize =
    same(account, appOwner) &&
    stage === 1;

  const canWithdraw =
    same(account, c.beneficiary) &&
    stage === 2 &&
    !c.withdrawn;

  const canRefund =
    stage === 3 &&
    myDonation > 0n;

  const card = document.createElement("article");
  card.className = "campaign";

  card.innerHTML = `
    <h3>#${id} ${c.title}</h3>

    <div class="campaign-info">
      <strong>Asset</strong>: ${symbol}<br>
      <strong>Stage</strong>: ${stageName(stage)}<br>
      <strong>Goal</strong>: ${format(c.goal)} ${symbol}<br>
      <strong>Raised</strong>: ${format(c.raised)} ${symbol}<br>
      <strong>Beneficiary</strong>: ${short(c.beneficiary)}<br>
      <strong>My Donation</strong>:
      ${format(myDonation)} ${symbol}
    </div>

    <div class="actions">
      ${
        stage === 1
          ? `<input id="amount-${id}" placeholder="기부 금액">`
          : ""
      }

      ${
        stage === 1 && !isETH
          ? `<button class="approveBtn">Approve ${tokenSymbol}</button>`
          : ""
      }

      ${
        stage === 1
          ? `<button class="donateBtn">Donate</button>`
          : ""
      }

      ${
        canFinalize
          ? `<button class="finalizeBtn">Finalize</button>`
          : ""
      }

      ${
        canWithdraw
          ? `<button class="withdrawBtn">Withdraw</button>`
          : ""
      }

      ${
        canRefund
          ? `<button class="refundBtn">Refund</button>`
          : ""
      }
    </div>
  `;

  card.querySelector(".approveBtn")?.addEventListener(
    "click",
    () => approveGVT(id)
  );

  card.querySelector(".donateBtn")?.addEventListener(
    "click",
    () => donate(id)
  );

  card.querySelector(".finalizeBtn")?.addEventListener(
    "click",
    () => finalize(id)
  );

  card.querySelector(".withdrawBtn")?.addEventListener(
    "click",
    () => withdraw(id)
  );

  card.querySelector(".refundBtn")?.addEventListener(
    "click",
    () => refund(id)
  );

  $("campaignList").appendChild(card);
}

async function createCampaign() {
  const title = $("titleInput").value.trim();
  const goal = $("goalInput").value.trim();
  const beneficiary = $("beneficiaryInput").value.trim();

  const asset =
    $("assetSelect").value === "ETH"
      ? ethers.ZeroAddress
      : CONFIG.token;

  if (
    !title ||
    !goal ||
    !ethers.isAddress(beneficiary)
  ) {
    setStatus("Campaign 입력값을 확인하세요.");
    return;
  }

  const rawGoal =
    same(asset, ethers.ZeroAddress)
      ? ethers.parseEther(goal)
      : ethers.parseUnits(goal, tokenDecimals);

  await runTx(
    "Campaign 생성",
    () => giveChainWrite.createCampaign(
      title,
      rawGoal,
      beneficiary,
      asset
    )
  );
}

async function approveGVT(id) {
  const value = $(`amount-${id}`)?.value.trim();

  if (!value) {
    setStatus("금액을 입력하세요.");
    return;
  }

  const amount = ethers.parseUnits(
    value,
    tokenDecimals
  );

  await runTx(
    `${tokenSymbol} 사용 승인`,
    () => tokenWrite.approve(
      CONFIG.giveChain,
      amount
    )
  );
}

async function donate(id) {
  const value = $(`amount-${id}`)?.value.trim();

  if (!value) {
    setStatus("기부 금액을 입력하세요.");
    return;
  }

  const c = await giveChainRead.campaigns(id);

  if (same(c.asset, ethers.ZeroAddress)) {
    const amount = ethers.parseEther(value);

    await runTx(
      "ETH 기부",
      () => giveChainWrite.donateETH(
        id,
        { value: amount }
      )
    );

    return;
  }

  const amount = ethers.parseUnits(
    value,
    tokenDecimals
  );

  await runTx(
    `${tokenSymbol} 기부`,
    () => giveChainWrite.donateToken(
      id,
      amount
    )
  );
}

async function finalize(id) {
  await runTx(
    "Campaign 종료 판정",
    () => giveChainWrite.finalizeCampaign(id)
  );
}

async function withdraw(id) {
  await runTx(
    "수혜자 출금",
    () => giveChainWrite.withdraw(id)
  );
}

async function refund(id) {
  await runTx(
    "기부금 환불",
    () => giveChainWrite.refund(id)
  );
}

async function runTx(label, send) {
  try {
    setStatus(`${label}: MetaMask 승인 대기 중...`);

    const tx = await send();

    setStatus(`
      ${label} 제출됨<br>
      <a href="${txUrl(tx.hash)}" target="_blank">
        ${short(tx.hash)}
      </a>
    `);

    const receipt = await tx.wait();

    if (receipt.status !== 1) {
      throw new Error("Transaction이 실패했습니다.");
    }

    setStatus(`
      ${label} 완료<br>
      Block: ${receipt.blockNumber}<br>
      <a href="${txUrl(tx.hash)}" target="_blank">
        Explorer에서 확인
      </a>
    `);

    await refreshAll();

    return receipt;
  }
  catch (error) {
    setStatus(
      `${label} 실패: ${friendlyError(error)}`
    );

    return null;
  }
}

async function loadDonationEvents() {
  if (!giveChainRead) {
    setStatus("먼저 Wallet을 연결하세요.");
    return;
  }

  try {
    const latest = await provider.getBlockNumber();

    const fromBlock =
      CONFIG.deploymentBlock > 0
        ? CONFIG.deploymentBlock
        : Math.max(0, latest - 5000);

    const logs = await giveChainRead.queryFilter(
      giveChainRead.filters.Donated(),
      fromBlock,
      latest
    );

    if (logs.length === 0) {
      $("eventList").innerHTML =
        "<li>기부 Event가 없습니다.</li>";
      return;
    }

    $("eventList").innerHTML =
      logs
        .slice(-20)
        .reverse()
        .map((log) => {
          const [
            campaignId,
            donor,
            asset,
            amount
          ] = log.args;

          return `
            <li>
              Campaign #${campaignId}
              · ${short(donor)}
              · ${formatAmount(asset, amount)}
              · <a href="${txUrl(log.transactionHash)}" target="_blank">Tx</a>
            </li>
          `;
        })
        .join("");
  }
  catch (error) {
    setStatus(friendlyError(error));
  }
}

function listenEvents() {
  if (!giveChainRead) return;

  giveChainRead.removeAllListeners("Donated");

  giveChainRead.on(
    "Donated",
    async (campaignId, donor, asset, amount) => {
      setStatus(`
        새 기부 감지<br>
        Campaign #${campaignId}<br>
        ${short(donor)}<br>
        ${formatAmount(asset, amount)}
      `);

      await refreshAll();
    }
  );
}

async function refreshAll() {
  if (!account || !giveChainRead) return;

  await loadAccountSummary();
  await loadCampaigns();
}

$("connectBtn").addEventListener(
  "click",
  connectWallet
);

$("refreshBtn").addEventListener(
  "click",
  async () => {
    if (!account) {
      setStatus("먼저 Wallet을 연결하세요.");
      return;
    }

    await refreshAll();
    setStatus("화면을 새로고침했습니다.");
  }
);

$("createBtn").addEventListener(
  "click",
  createCampaign
);

$("eventsBtn").addEventListener(
  "click",
  loadDonationEvents
);

if (window.ethereum) {
  window.ethereum.on(
    "accountsChanged",
    () => location.reload()
  );

  window.ethereum.on(
    "chainChanged",
    () => location.reload()
  );
}

</script>
</body>
</html>
